[project]
name = "echochat-backend"
version = "0.1.0"
description = "Local EchoChat API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_cache/tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
